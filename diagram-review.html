<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Diagram Review</title><style>body{font:16px system-ui;max-width:700px;margin:auto;padding:20px;background:#101c2c;color:#eee}a{color:#9cf}label{display:block;margin:15px 0}input,textarea,select{display:block;width:95%;padding:10px;background:#253c58;color:white;border:1px solid #6686a4;border-radius:7px}button{padding:12px;background:#315d85;color:white;border:1px solid #9bd;border-radius:8px}</style><nav><a href="./landscape.html">Knowledge Landscape</a> · <a href="./references.html">Reference registry</a></nav><h1>Diagram evidence review</h1><p>Our 62 collected reference diagrams remain private pending source and rights checks. This form exports a local JSON review record. It does not upload content.</p><label>Asset identifier<input id="asset"></label><label>Diagram title<input id="title"></label><label>Original source URL<input id="source"></label><label>Creator or publisher<input id="creator"></label><label>Reuse rights<select id="rights"><option>Unverified</option><option>Open license documented</option><option>Permission documented</option><option>Public domain documented</option></select></label><label>License or permission evidence<textarea id="evidence"></textarea></label><label>Scientific notes, interpretation and uncertainty<textarea id="notes"></textarea></label><button id="export">Export JSON review</button><p id="status"></p><script>document.querySelector("#export").onclick=function(){let ids=["asset","title","source","creator","rights","evidence","notes"];let d={schema:"atlas-diagram-review/0.1",review_status:"pending",publication_authorized:false};ids.forEach(k=>d[k]=document.getElementById(k).value);if(!d.asset.trim()){document.querySelector("#status").textContent="Asset identifier required";return}let u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));let a=document.createElement("a");a.href=u;a.download="diagram-review.json";a.click();document.querySelector("#status").textContent="Saved locally; no upload performed."};</script></html>
